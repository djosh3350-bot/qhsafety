    /* Phone layout safety net: long words, links and e-mail addresses wrap instead of widening the page;
       fields and flexible columns may shrink, so the button beside them stays inside the card. */
    #main-scroll, .qh-sheet, #qh-modal-overlay { overflow-wrap:anywhere; }
    #main-scroll { overflow-x:hidden; }
    #main-scroll input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=range]), #main-scroll textarea, #main-scroll select { min-width:0; max-width:100%; }
    #main-scroll [style*="flex:1"], #main-scroll .flex-1 { min-width:0; }

    /* Small pill buttons and pill dropdowns ("Assign to me", "Saved replies…", "Remind me to follow up") are one

    #qh-modal-overlay {
    position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:9999;

    opacity:0;pointer-events:none;visibility:hidden;transition:opacity 0.2s,visibility 0.2s;

  .btn-row{display:flex;align-items:center;justify-content:center;gap:8px;text-align:center}
  .btn-danger-ghost{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600;color:#c62828;background:transparent;border:1px solid rgba(198,40,40,.35);white-space:nowrap}
  .btn-danger-ghost:hover{background:rgba(198,40,40,.08)}
  :root[data-theme="dark"] .btn-danger-ghost{color:#ef9a9a;border-color:rgba(239,154,154,.4)}

  .google-btn{display:flex;align-items:center;justify-content:center;gap:10px;padding:11px 16px;border-radius:8px;background:#fff;color:#1f1f1f;border:1px solid #dadce0;font-weight:600;font-size:14px}
  @media(hover:hover){.google-btn:hover{background:#f6f7f8}}
  .or-line{display:flex;align-items:center;gap:12px;margin:16px 0;font-size:12px}
  .or-line::before,.or-line::after{content:'';flex:1;height:1px;background:currentColor;opacity:.35}

  .qh-switch{position:relative;width:46px;height:26px;border-radius:13px;background:#9aa3ab;flex-shrink:0;transition:background-color .15s ease}
  .qh-switch.on{background:#f9a825}
  .qh-switch>span{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s ease}
  .qh-switch.on>span{transform:translateX(20px)}

  .qh-spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;display:inline-block;animation:spin .7s linear infinite;flex-shrink:0}
  html.lite .qh-spin{animation:spin .7s linear infinite !important}

  #qh-toasts{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:9998;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
  @media(min-width:768px){#qh-toasts{bottom:28px}}
  .qh-toast{background:#2c3e50;color:#fff;font-size:13px;font-weight:600;padding:10px 16px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0;transform:translateY(8px);transition:opacity .18s ease,transform .18s ease;text-align:center}
  .qh-toast.show{opacity:1;transform:none}
  .qh-toast-success{background:#2e7d32}
  .qh-toast-error{background:#c62828}
  :root[data-theme="dark"] .qh-toast{background:#f1f1f1;color:#1a1a1a}
  :root[data-theme="dark"] .qh-toast-success{background:#a5d6a7;color:#10310f}
  :root[data-theme="dark"] .qh-toast-error{background:#ef9a9a;color:#3b0a0a}

  .qh-viewer{position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
  .qh-viewer img{max-width:100%;max-height:100%;border-radius:8px}

  /* chat boxes stay pinned to the newest message without any scripting */
  .chat-scroll{display:flex;flex-direction:column-reverse;overflow-y:auto}
  .chat-list{display:flex;flex-direction:column;gap:8px}

  /* ── logo ── */
  .qh-logo{display:inline-flex;align-items:center;gap:.45em;font-family:'DM Sans',sans-serif;font-weight:500;letter-spacing:-.01em;line-height:1;white-space:nowrap}
  .qh-logo b{font-weight:700}
  #qh-boot{--lm-a:#2c3e50;--lm-b:#ffee58;--lm-c:#80deea}
  :root[data-theme="dark"] #qh-boot{--lm-a:#ffee58;--lm-b:#2c3e50;--lm-c:#2c3e50}
  .sev-tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:16px}
  @media(min-width:768px){.sev-tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
  .sev-tile{padding:12px 14px;border-radius:10px}
  .sev-num{font-size:26px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
  .sev-lab{font-size:12px;margin-top:2px}
  .sev-row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 0;border-top:1px solid}
  .sev-level{display:inline-block;padding:2px 8px;border-radius:999px;color:#fff;font-size:11px;font-weight:700}

  /* ── help, anonymous, badges, chips ── */
  .help-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:9px 12px;border-radius:8px;font-size:13px;font-weight:700;background:rgba(255,238,88,.14);color:#ffee58;border:1px solid rgba(255,238,88,.45)}
  .help-btn:hover{background:rgba(255,238,88,.24)}
  .help-btn.compact{padding:7px 12px}
  @media(max-width:420px){.help-btn.compact span{display:none}}
  .anon-btn{display:flex;align-items:center;justify-content:center;gap:10px;padding:10px 16px;margin-top:10px;border-radius:8px;background:transparent;border:1px solid;font-weight:600;font-size:14px}
  .nav-badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#ffee58;color:#2c3e50;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;line-height:1}
  .mobile-bottom-nav .nav-badge{position:absolute;top:-6px;right:-10px;min-width:16px;height:16px;font-size:10px}
  .status-chip,.assign-btn{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;border:1px solid;background:transparent;white-space:nowrap}
  .assign-btn{color:var(--qh-muted);border-color:var(--qh-line)}
  .assign-btn.mine{color:#1b5e20;border-color:#66bb6a;background:#e8f5e9}
  .assign-btn.other{color:#0d47a1;border-color:#90caf9;background:#e3f2fd}
  .new-chip{display:inline-block;vertical-align:middle;margin-left:4px;padding:1px 7px;border-radius:999px;background:#ffee58;color:#2c3e50;font-size:10px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
  .typing-line{font-size:12px;font-style:italic;color:var(--qh-muted);margin:-4px 0 8px 4px}
  .link-btn{background:none;border:none;padding:0;color:inherit;text-decoration:underline;text-underline-offset:2px;cursor:pointer;font:inherit;overflow-wrap:anywhere;text-align:left}
  .filter-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
  .filter-chips{display:flex;flex-wrap:wrap;gap:6px}
  .filter-chip{padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--qh-line);background:var(--qh-surface);color:var(--qh-text)}
  .filter-chip.on{background:#2c3e50;border-color:#2c3e50;color:#fff}
  :root[data-theme="dark"] .filter-chip.on{background:#ffee58;border-color:#ffee58;color:#2c3e50}
  .overdue-banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;margin-bottom:16px;border-radius:12px;background:#fdecea;color:#8e1b1b;border:1px solid #ef9a9a;font-size:14px}
  .overdue-banner span{flex:1 1 200px}
  .overdue-banner button{padding:6px 14px;border-radius:8px;background:#c62828;color:#fff;font-weight:700;font-size:13px}

  /* ── v10: after-hours note, library, mood, slots ── */
  .after-hours{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;margin-bottom:16px;border-radius:10px;background:#fff8e1;color:#5d4200;border:1px solid #ffe082;font-size:13px;line-height:1.5}
  .after-hours svg{margin-top:2px}
  .assign-btn.due{color:#8e1b1b;border-color:#ef9a9a;background:#fdecea}
  select.assign-btn{-webkit-appearance:none;appearance:none;cursor:pointer;font-family:inherit;max-width:240px;text-overflow:ellipsis}
  select.filter-chip{-webkit-appearance:none;appearance:none;cursor:pointer;font-family:inherit}
  .lib-item{border-radius:12px;overflow:hidden}
  .lib-item>summary{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;list-style:none}
  .lib-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .lib-item[open] .lib-chev{transform:rotate(180deg)}
  .lib-chev{transition:transform .15s ease}
  .lib-item>ul{list-style:disc;padding:0 20px 16px 48px;font-size:14px;line-height:1.6}
  .lib-item>ul>li+li{margin-top:8px}
  .mood-strip{display:flex;align-items:flex-end;gap:4px;height:34px;margin-top:14px;max-width:320px}
  .mood-strip>span{flex:1;border-radius:3px;min-height:4px}
  .slot-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:8px;border:1px solid;background:transparent;font-size:12px;font-weight:600;min-height:36px}

  /* ── sheets: help screen and case history ── */
  .qh-sheet-wrap{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;transition:opacity .18s ease}
  .qh-sheet-wrap.open{opacity:1}
  .qh-sheet{background:var(--qh-surface);color:var(--qh-text);border-radius:20px;padding:22px;width:100%;max-width:440px;max-height:calc(100dvh - 32px);overflow-y:auto;box-shadow:0 24px 48px rgba(0,0,0,.25)}
  .qh-sheet.wide{max-width:640px}
  .qh-sheet-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .qh-sheet-head h2{flex:1;font-size:20px;font-weight:700}
  .qh-help-icon{width:40px;height:40px;border-radius:50%;background:#ffee58;color:#2c3e50;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .qh-sheet-x{width:36px;height:36px;border-radius:50%;background:var(--qh-chip);color:var(--qh-text);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .qh-sheet-lead{font-size:14px;line-height:1.55;color:var(--qh-muted);margin-bottom:14px}
  .qh-line{padding:12px 0;border-top:1px solid var(--qh-line)}
  .qh-line-name{font-weight:700;font-size:15px}
  .qh-line-note{font-size:13px;color:var(--qh-muted);margin-top:2px}
  .qh-line-nums{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .qh-line-nums a{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:10px;background:var(--qh-chip);color:var(--qh-text);text-decoration:none;flex:1 1 150px;min-height:44px}
  .qh-line-nums a b{display:block;font-size:15px}
  .qh-line-nums a small{display:block;font-size:11px;color:var(--qh-muted)}
  .qh-sheet-close{width:100%;margin-top:14px;padding:12px;border-radius:10px;background:var(--qh-chip);color:var(--qh-text);font-weight:700;font-size:14px;text-align:center}
  .qh-timeline{display:flex;flex-direction:column}
  .qh-tl-row{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--qh-line)}
  .qh-tl-dot{width:10px;height:10px;border-radius:50%;margin-top:5px;flex-shrink:0}
  .qh-tl-meta{font-size:11px;color:var(--qh-muted)}
  .qh-tl-title{font-weight:700;font-size:14px;overflow-wrap:anywhere}
  .qh-tl-body{font-size:13px;color:var(--qh-muted);white-space:pre-wrap;overflow-wrap:anywhere;margin-top:2px}
  .qh-tl-extra{font-size:12px;margin-top:4px;overflow-wrap:anywhere}

  /* ── report ── */
  .rep-bars{display:flex;flex-direction:column;gap:10px}
  .rep-row{display:grid;grid-template-columns:minmax(90px,38%) 1fr 32px;align-items:center;gap:10px;font-size:13px}
  .rep-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rep-track{display:block;height:8px;border-radius:4px;background:var(--qh-chip);overflow:hidden}
  .rep-fill{display:block;height:100%;border-radius:4px}
  .rep-val{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
  .rep-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:8px;border:1px solid;font-size:13px;font-weight:600;background:transparent}
  @media(min-width:768px){.md\:grid-cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}}
  @media print{
    .desktop-sidebar,.mobile-topbar,.mobile-bottom-nav,.drawer-panel,.drawer-overlay,.rep-btn,input[type="month"],#qh-toasts{display:none !important}
    .screen,#app,body,html,#main-scroll{height:auto !important;overflow:visible !important}
    body,#main-scroll{background:#fff !important}
    .rep-fill{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }

  /* thin, quiet scrollbars inside cards */
  #app *{scrollbar-width:thin;scrollbar-color:rgba(128,128,128,.35) transparent}
  details>summary::-webkit-details-marker{display:none}
  a{overflow-wrap:anywhere}
  </style>
</head>
